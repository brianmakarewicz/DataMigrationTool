name: Offline unit tests

# Runs every offline unit test under test/unit on every pull request and on pushes
# to main (backlog #665). These tests use fakes only -- fake connections, fake
# docker/curl/SQLcl on a private PATH, temp directories -- and never reach a real
# database, Fusion or ATP, so a GitHub-hosted runner with no secrets is enough.
#
#   * every test/unit/test_*.py (each is a standalone script; exit 0 = all passed)
#   * test/unit/test_apex_images_rebuild.sh (offline shell test, fakes only)
#
# Not run here, on purpose:
#   * test/unit/test_*.sql -- PL/SQL unit tests that need the local Docker DB
#     (dmt2-local); they run through test/unit/run_unit_tests.sh and the
#     self-hosted local-regression gate.
#   * test/unit/setup_fusion_config.py -- not a test; it reads live credentials
#     (connections.json via conn_helper) and connects to ATP.
#
# python-oracledb is installed only because some scripts under test import it at
# module load; the tests replace every connect call with a fake.
#
# Every test runs even after an earlier one fails, and the job fails if any did.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "oracledb==3.4.2"

      - name: Python unit tests (test/unit/test_*.py)
        if: always()
        env:
          PYTHONUTF8: "1"
        run: |
          failed=""
          for t in test/unit/test_*.py; do
            echo "::group::$t"
            if python "$t"; then
              echo "PASS  $t"
            else
              echo "::error file=$t::unit test failed"
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
          echo "All Python unit tests passed"

      - name: APEX images rebuild (offline shell test)
        if: always()
        run: sh test/unit/test_apex_images_rebuild.sh
